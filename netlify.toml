# netlify.toml

[build]
  publish = "."
  functions = "netlify/functions" # <-- Adicionado

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[redirects]]
  from = "/favicon.ico"
  to = "https://cdn.jsdelivr.net/gh/supabase/supabase@master/apps/www/public/favicon.ico"
  status = 200

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = false

# Força HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"