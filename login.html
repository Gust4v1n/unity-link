<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Admin Supabase</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login-style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="theme-toggle">
                    <button id="themeToggle" class="btn-theme" onclick="toggleTheme()">
                        <i class="fas fa-sun"></i>
                    </button>
                </div>
                <div class="logo">
                    <i class="fas fa-database"></i>
                </div>
                <h1>Admin Supabase</h1>
                <p>Faça login para continuar</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <div class="input-container">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Username" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-container">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Senha" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="ip-info">
                    <i class="fas fa-globe"></i>
                    <span>Seu IP: <span id="userIP">Carregando...</span></span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Entrar
                </button>
            </form>

            <div class="login-footer">
                <p>Sistema de autenticação com validação de IP</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="login-script.js"></script>
</body>
</html>
